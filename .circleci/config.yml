version: 2.1

orbs:
    node: circleci/node@7.2.0
    android: circleci/android@3.1.0

jobs:
    e2e-android:
        executor:
            name: android/android_machine
            resource_class: large
            tag: default
        environment:
            CI: true
            EXPO_NO_WAIT: true

        steps:
            - checkout

            # Setup Node.js (using orb for consistency)
            - node/install:
                  node-version: "20"

            # Install dependencies
            - run:
                  name: Install npm dependencies
                  command: npm ci

            # Install Expo CLI (globally)
            - run:
                  name: Install Expo CLI
                  command: npm install -g expo-cli

            # Prebuild the Expo app into native Android code
            - run:
                  name: Prebuild Expo app
                  command: npm run prebuild

            # Start Metro bundler in background
            - run:
                  name: Start Metro Bundler
                  command: npx expo start --dev-client --port 8081 &
                  background: true

            # Wait for Metro to start
            - run:
                  name: Wait for Metro
                  command: |
                      for i in {1..30}; do
                        if nc -z localhost 8081; then
                          echo "Metro is up!"
                          break
                        fi
                        echo "Waiting for Metro..."
                        sleep 2
                      done

            # Start emulator and run tests via orb
            - android/start_emulator_and_run_tests:
                  system_image: system-images;android-31;default;x86_64
                  test_command: |
                      echo "🛠️ Building Android app for Detox..."
                      npm run e2e:build:android

                      echo "🚀 Running Detox E2E tests..."
                      npm run e2e:test:android

workflows:
    e2e:
        jobs:
            - e2e-android
