version: 2.1

orbs:
    node: circleci/node@7.2.0
    android: circleci/android@3.1.0

jobs:
    e2e-android:
        executor:
            name: android/android_machine
            resource_class: large
            tag: default
        environment:
            CI: true
            EXPO_NO_WAIT: true
            DETOX_LOGLEVEL: trace
            METRO_PORT: 8081
        steps:
            - checkout

            # Setup Node
            - node/install:
                  node-version: "20"

            # Install deps
            - run:
                  name: Install dependencies
                  command: npm ci

            # Install Expo CLI
            - run:
                  name: Install Expo CLI
                  command: npm install -g expo-cli

            # Prebuild app
            - run:
                  name: Prebuild Expo app
                  command: npm run prebuild

            # Start Metro bundler (detached)
            - run:
                  name: Start Metro bundler
                  command: |
                      nohup npx expo start --dev-client --port $METRO_PORT --host 0.0.0.0 > metro.log 2>&1 &
                      sleep 5
                      echo "Metro started on port $METRO_PORT"

            # Create AVD
            - android/create_avd:
                  avd_name: Pixel_8_API_35
                  system_image: system-images;android-31;default;x86_64
                  install: true

            # Start emulator and unlock
            - android/start_emulator:
                  avd_name: Pixel_8_API_35
                  no_window: true
                  post_emulator_launch_assemble_command: ""
            - run:
                  name: Wait for device to be ready
                  command: |
                      adb wait-for-device
                      adb shell input keyevent 82
                      adb devices

            # Detox build and test
            - run:
                  name: Build and run Detox tests
                  command: |
                      echo "🛠️ Building Detox app..."
                      npm run e2e:build:android
                      echo "🚀 Running Detox tests..."
                      npm run e2e:test:android --headless --record-logs all --record-videos all

workflows:
    e2e:
        jobs:
            - e2e-android
